name: CI

# CPU-only checks. Triton kernels are exercised through Triton's CPU interpreter; tests that need
# a GPU (timing, tensor cores, large shapes, torch.compile on CUDA) are skipped here and run with
# scripts/gpu_validate.sh on GPU hardware. No performance numbers are produced in CI.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU PyTorch wheel)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint and type check
        if: matrix.python-version == '3.12'
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: Tests (Triton interpreter on CPU)
        run: pytest
